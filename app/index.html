let lang='en', lastResult=null, lastFix=null, casesCache=[], cfg={}, lastCase=null;
let howOpen=true, howSeenResult=false;

function t(){return I18N[lang]||I18N.en;}
function loadLang(){
  try{const s=localStorage.getItem('ui-lang');if(s==='en'||s==='ko')lang=s;}catch(_){}
}
function saveLang(){
  try{localStorage.setItem('ui-lang',lang);}catch(_){}
}

function rowsLabel(n){
  const c=Number(n);
  if(lang==='ko')return c+'행';
  return c===1?'1 row':c+' rows';
}

function trLabel(label){
  if(lang!=='ko')return label;
  return CHAIN_LABEL_KO[label]||label;
}
function trHeadline(h){
  if(lang!=='ko')return h;
  return HEADLINE_KO[h]||h;
}
function trTool(name){
  if(lang!=='ko'||!name)return name;
  return TOOL_KO[name]||name;
}

function dedupeCitations(text){
  return String(text??'').replace(/(\[[a-z_]+:[^\]]+\])(?:\s*\1)+/gi,'$1');
}

function renderHow(){
  const i=t();
  const steps=[[i.how1,i.how1d],[i.how2,i.how2d],[i.how3,i.how3d],[i.how4,i.how4d]];
  $('#how').innerHTML=`<p class="how-label">${esc(i.howTitle)}</p><div class="how-steps">${steps.map(([t,d],n)=>`<div class="how-step"><span class="how-n">${esc(n+1)}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}</div>`;
  const link=$('#how-link');
  link.textContent=i.howTitle;
  $('#how').hidden=!howOpen;
  link.hidden=!howSeenResult;
}

function hideHowAfterResult(){
  if(howSeenResult)return;
  howSeenResult=true;
  howOpen=false;
  renderHow();
}

function applyChrome(){
  const i=t();
  document.documentElement.lang=lang==='ko'?'ko':'en';
  document.title=i.title.replace(/\.$/,'');
  $('#title').textContent=i.title;
  $('#subtitle').textContent=i.subtitle;
  $('#sponsors').textContent=i.sponsors;
  $('#msg').placeholder=i.placeholder;
  $('#go').textContent=i.go;
  $('#lang').innerHTML=`<button type="button" class="ghost${lang==='en'?' on':''}" data-lang="en">EN</button><button type="button" class="ghost${lang==='ko'?' on':''}" data-lang="ko">한국어</button>`;
  document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;saveLang();applyChrome();renderSamples();if(lastResult)render(lastResult,{scroll:false});});
  const eh=$('#empty-hint');
  if(eh.dataset.show==='1')eh.textContent=i.emptyHint;
  renderHow();
  renderSamples();
}

function statusLine(r){
  const i=t();
  const be=String(r.backend||'');
  const data=be?( /zetaris/i.test(be)?i.dataZetaris:i.dataLocal):'';
  if(!r.ok)return data;
  const parts=[];
  if(r.limited)parts.push(i.limitedExplain(r.limited));
  else if(r.llm==='verifier-only')parts.push(i.recheckExplain);
  else if(r.llm==='failed')parts.push(i.failedExplain);
  else if(r.llm==='unreachable')parts.push(i.unreachableExplain);
  else if(r.llm==='none'||!r.llm)parts.push(i.templateExplain);
  else parts.push(i.answeredBy(r.llm));
  if(data)parts.push(data);
  if(r.elapsed_ms!=null)parts.push(r.elapsed_ms+' '+i.ms);
  return parts.join(' · ');
}

function showReceipt(r){
  const el=$('#receipt-line');
  if(!el)return;
  const i=t();
  if(!Array.isArray(r.receipts)||!r.receipts.length){el.hidden=true;el.textContent='';return;}
  const last=r.receipts[r.receipts.length-1]||{};
  const model=last.model||last.provider_model||last.requested_model||'';
  const rid=last.receipt_id||'';
  if(!model&&!rid){el.hidden=true;el.textContent='';return;}
  el.hidden=false;
  el.textContent=i.routedBy(model||'—',rid||'—');
}

function goToRef(ref){
  if(!ref)return;
  const details=$('#evidence');
  if(details&&!details.open)details.open=true;
  const el=document.getElementById('row-'+slug(ref));
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1500);
}

function linkifyExplain(text){
  return esc(dedupeCitations(text)).replace(/\[([a-z_]+:[^\]]+)\]/gi,(_,ref)=>`<a class="cite" href="#row-${esc(slug(ref))}" data-ref="${esc(ref)}">[${esc(ref)}]</a>`);
}

function renderSamples(){
  const i=t();
  if(!casesCache.length){$('#samples').innerHTML='';return;}
  $('#samples').innerHTML=`<span class="label">${esc(i.examples)}</span>`+casesCache.map(c=>{
    const ex=EXAMPLES[c.case]||{label:c.title,send:'order '+String(c.order_id||'')};
    return `<button type="button" class="ghost" data-case="${esc(c.case)}" data-send="${esc(ex.send)}">${esc(ex.label)}</button>`;
  }).join('');
  document.querySelectorAll('#samples button').forEach(b=>b.onclick=()=>{
    $('#msg').value=b.dataset.send;lastCase=+b.dataset.case;$('#empty-hint').hidden=true;$('#empty-hint').dataset.show='';run();
  });
}

async function loadCases(){
  try{
    const res=await fetch('/api/cases');
    if(!res.ok)throw new Error('http');
    casesCache=await res.json();
  }catch(_){casesCache=[];}
  renderSamples();
}

async function run(live){
  const i=t();
  const message=$('#msg').value.trim();
  const ex=lastCase&&EXAMPLES[lastCase];
  const caseNo=(ex&&ex.send===message)?lastCase:null;
  const hint=$('#empty-hint');
  if(!message){
    hint.hidden=false;hint.dataset.show='1';hint.textContent=i.emptyHint;$('#status').textContent='';return;
  }
  hint.hidden=true;hint.dataset.show='';
  $('#status').textContent=i.investigating;
  $('#go').disabled=true;
  lastFix=null;
  try{
    const res=await fetch('/api/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,lang,case:caseNo,live:!!live})});
    if(!res.ok){
      lastResult=null;
      hideHowAfterResult();
      $('#out').innerHTML=`<div class="card"><div class="headline">${esc(i.errHttp)}</div><p class="hint">${esc(i.emptyHint)}</p></div>`;
      $('#out').scrollIntoView({behavior:'smooth',block:'start'});
      $('#status').textContent='';
      return;
    }
    const r=await res.json();
    lastResult=r;
    $('#status').textContent=statusLine(r);
    showReceipt(r);
    render(r);
  }catch(_){
    lastResult=null;
    hideHowAfterResult();
    $('#out').innerHTML=`<div class="card"><div class="headline">${esc(i.errNetwork)}</div><p class="hint">${esc(i.emptyHint)}</p></div>`;
    $('#out').scrollIntoView({behavior:'smooth',block:'start'});
    $('#status').textContent='';
  }finally{
    $('#go').disabled=false;
  }
}

function renderChain(chain, clickable){
  const i=t();
  return (chain||[]).map((l,idx)=>{
    const attrs=clickable?` data-i="${esc(idx)}" tabindex="0" role="button"`:'';
    return `<div class="link ${esc(l.state)}"${attrs}><b>${esc(trLabel(l.label))}</b><small>${esc(l.note)}</small>${l.refs.length?`<small class="mut">${esc(rowsLabel(l.refs.length))} ↗</small>`:''}</div>`;
  }).join('');
}

function prettySql(q){
  // the one journey query lists ~30 aliased columns; show the shape, keep FROM/JOIN/WHERE verbatim
  let x=String(q).replace(/^SELECT\s+o\.order_id AS o__order_id.*?\s+FROM /s,'SELECT o.*, p.*, g.*, l.*, m.*  -- (aliased column list shortened)\nFROM ');
  return x.replace(/\s+(LEFT JOIN|WHERE|ORDER BY|LIMIT)\s+/g,'\n$1 ');
}
function sqlSource(r){return /zetaris/i.test(String(r.backend||''))?'Zetaris · lightning.metastore.demo.order_journey':'DuckDB over the synthetic CSVs';}

function renderWhy(r){
  const i=t(), c=r.citation_check||{};
  // model explanation that passed: one line per sentence with what was checked against the cited rows
  if(c.checked&&c.ok&&Array.isArray(c.claims)&&c.claims.length)
    return `<ul class="claims">${c.claims.map(x=>`<li><span class="ok-mark">✓</span> ${linkifyExplain(x.sentence)}${x.facts&&x.facts.length?` <span class="mut" style="font-size:12px">(${esc(i.checkedFacts(x.facts))})</span>`:''}</li>`).join('')}</ul>`;
  return `<p>${linkifyExplain(r.explanation)}</p>`;
}

function renderSteps(steps){
  const i=t();
  if(!Array.isArray(steps)||!steps.length)return'';
  const items=steps.map(s=>{
    const bits=[`<div>${esc(s.thought||'')}</div>`];
    if(s.tool){
      const args=s.args!=null?(typeof s.args==='string'?s.args:JSON.stringify(s.args)):'';
      bits.push(`<div class="tool">${esc(trTool(s.tool))}${args?` ${esc(args)}`:''}${s.rows!=null?` · ${esc(rowsLabel(s.rows))}`:''}${s.refused?` · ${esc(i.refused)}`:(s.error?' · error':'')}</div>`);
      if(Array.isArray(s.sql)&&s.sql.length)bits.push(`<details class="sql"><summary>${esc(i.sqlSent)}</summary><pre>${esc(s.sql.map(prettySql).join('\n\n'))}</pre></details>`);
    }
    if(s.receipt){
      const m=s.receipt.model||s.receipt.provider_model||s.receipt.requested_model||'';
      if(m)bits.push(`<div class="mut">${esc(i.modelLabel)}: ${esc(m)}</div>`);
    }
    if(s.planned)bits.push(`<div class="mut" style="font-size:12px">${esc(i.planned)}${s.skipped?' · '+esc(s.skipped):''}</div>`);
    if(s.done||s.order_id)bits.push(`<div class="mut">${esc(i.namedOrder)}: <b>${esc(s.order_id||'—')}</b></div>`);
    if(s.ms!=null)bits.push(`<div class="mut">${esc(s.ms)} ${esc(i.ms)}</div>`);
    return `<li>${bits.join('')}</li>`;
  }).join('');
  return `<div class="card"><h2>${esc(i.investigation)}</h2><ol class="timeline">${items}</ol></div>`;
}

function renderBanner(r){
  const i=t();let h='';
  if(cfg.fake||String(r.llm||'').startsWith('FAKE'))h+=`<div class="card banner"><span class="fake">${esc(i.fakeNote)}</span></div>`;
  if(r.recorded)h+=`<div class="card banner"><div>${esc(i.recorded(String(r.recorded.recorded_at||'').replace('T',' ').slice(0,16),r.recorded.provider||'Nebius Token Factory'))}</div><div style="margin-top:8px"><button type="button" id="run-live">${esc(i.runLive)}</button></div></div>`;
  return h;
}
function renderIntake(r){

  const g=k.grounded||{},ph=k.placeholders||{};

  const row=(lab,val)=>val?`<tr><th>${esc(lab)}</th><td>${val}</td></tr>`:'';
  const rows=[row(i.sender,who(g.sender)),row(i.otherPeople,(g.other_people||[]).map(who).join(', ')),row(i.orderNos,esc((g.order_ids||[]).join(', '))),
    row(i.foreignNos,esc((g.foreign_order_ids||[]).join(', '))),row(i.amountSaid,g.amount?esc(Number(g.amount.value).toLocaleString()+' '+g.amount.currency):''),
    row(i.paidWhen,esc(g.paid_when||'')),row(i.pack,esc(g.pack||'')),row(i.complaint,esc(String(g.complaint||'').replace(/_/g,' '))),row(i.wants,esc((g.wants||[]).join(', ').replace(/_/g,' ')))].join('');
  const plan=(g.plan||[]).map(s=>`<li><span class="tool">${esc(trTool(s.tool))} ${esc(JSON.stringify(s.args))}</span> — ${esc(s.why)}</li>`).join('');
  const drop=(g.dropped||[]).length?`<p class="drop">${esc(i.dropped)} ${esc(g.dropped.map(d=>d.field+': '+(typeof d.value==='string'?d.value:JSON.stringify(d.value))+' ('+d.why+')').join('; '))}</p>`:'';
  return `<div class="card"><h2>${esc(i.intakeTitle)} <span class="tag">${esc(k.model||'')}</span></h2>

    ${plan?`<p class="mut" style="margin:10px 0 2px;font-size:13px">${esc(i.planTitle)}</p><ol class="timeline" style="margin-top:4px">${plan}</ol>`:''}</div>`;

function render(r, opts){
  const i=t();
  const scroll=!(opts&&opts.scroll===false);
  const afterFix=!!(opts&&opts.afterFix)||!!lastFix;
  hideHowAfterResult();
  if(!r.ok){
    $('#out').innerHTML=`${renderFixCard()}<div class="card"><div class="headline">${esc(trHeadline(r.headline))}</div><p class="hint">${esc(i.noOrderHint)}</p></div>`;
    if(scroll)$('#out').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const chain=renderChain(r.chain,true);
  const cited=new Set(r.chain.flatMap(l=>l.refs));
  const rows=Object.entries(r.rows).map(([table,rs])=>rs.length?`<h3 style="margin:10px 0 4px;font-size:14px">${esc(table)} <span class="tag">${esc(rowsLabel(rs.length))}</span></h3><table><tr>${Object.keys(rs[0]).filter(k=>k!=='ref').map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${rs.map(x=>`<tr class="${cited.has(x.ref)?'cited':''}" id="row-${esc(slug(x.ref))}">${Object.entries(x).filter(([k])=>k!=='ref').map(([,v])=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`:'').join('');
  let citeNote=i.citationSkip;
  if(r.citation_check&&r.citation_check.checked)citeNote=r.citation_check.ok?i.citationOk:i.citationFail;
  const needsFix=r.broken!=null;
  const fixTag=needsFix
    ?`<span class="tag warn">${esc(i.needsApproval)}</span>`
    :`<span class="tag ok">${esc(i.noFixNeeded)}</span>`;
  const rc=r.citation_check||{};
  const tplNote=rc.reply_replaced?`<p class="reply-note">${esc(i.replyTemplate(rc.reply_reason||'check failed'))}</p>`:'';
  const replyNote=tplNote+(afterFix?`<p class="reply-note">${esc(i.sendAfterFix)}</p>`:(needsFix?`<p class="reply-note">${esc(i.sendAfterApprove)}</p>`:''));

  $('#out').innerHTML=`
  ${renderBanner(r)}${renderFixCard()}
  <div class="card"><div class="headline">${esc(trHeadline(r.headline))}</div><div class="mut">order ${esc(r.order_id)} · ${esc(r.email)}</div>${r.ignored_order?`<div class="warnline">${esc(i.ignoredOrder(r.ignored_order))}</div>`:''}${r.sender_unverified?`<div class="warnline">${esc(i.senderUnverified)}</div>`:''}
    <div class="chain">${chain}</div></div>
  <div class="two">
    <div class="card"><div class="card-head"><h2>${esc(i.reply)}</h2><button type="button" class="ghost" id="copy-reply">${esc(i.copy)}</button></div>
      ${replyNote}<div class="prose" id="reply-text">${esc(r.customer_reply)}</div>
      <div style="margin-top:10px"><button type="button" class="ghost" id="evidence-btn">${esc(i.evidenceBtn)}</button></div></div>
    <div class="card"><div class="card-head"><h2>${esc(i.fix)} ${fixTag}</h2></div><div class="prose">${esc(r.fix_action)}</div>
      ${needsFix?`<div style="margin-top:10px"><button type="button" id="approve-btn">${esc(i.approveFix)}</button></div>`:''}
      <p id="approve-msg" class="hint" style="margin:8px 0 0" hidden></p></div>
  </div>
  ${renderClaims(r)}
  ${renderIntake(r)}
  ${renderSteps(r.steps)}
  ${renderCalls(r)}
  <div class="card"><h2>${esc(i.why)}</h2>${renderWhy(r)}${(!r.citation_check||!r.citation_check.checked||r.citation_check.replaced_with_verifier_text)?`<p class="hint">${esc(i.knownPattern)}</p>`:''}
    <p class="mut" style="font-size:12px">${esc(citeNote)}</p></div>
  <div class="card two"><div><h2>${esc(i.verified)}</h2><ul>${r.verified.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>
    <div><h2>${esc(i.unverified)}</h2><ul>${r.unverified.map(v=>`<li>${esc(v)}</li>`).join('')||`<li class="mut">—</li>`}</ul></div></div>
  <details class="card rows" id="evidence"><summary>${esc(i.evidence)}</summary>${(()=>{const q=(r.queries||[]).filter(x=>x.tool==='order_journey').pop();return q?`<p class="hint">${esc(i.oneQuery(sqlSource(r),q.rows))}</p><pre class="sqlbox">${esc(prettySql(q.sql))}</pre>`:'';})()}${rows}</details>
  <details class="card" id="trace"><summary>${esc(i.trace)}</summary><ul>${(r.trace||[]).map(tr=>`<li><b>${esc(tr.step)}</b> — ${esc(tr.detail)} <span class="mut">${esc(tr.ms)} ${esc(i.ms)}</span></li>`).join('')}</ul>${(r.queries||[]).length?`<p class="hint">${esc(i.allSql(sqlSource(r)))}</p><pre class="sqlbox">${esc(r.queries.map(q=>`-- ${q.tool} · ${q.rows} row(s)\n`+prettySql(q.sql)).join('\n\n'))}</pre>`:''}</details>`;

  const copyBtn=$('#copy-reply');
  if(copyBtn)copyBtn.onclick=async()=>{
    try{await navigator.clipboard.writeText(r.customer_reply);copyBtn.textContent=t().copied;setTimeout(()=>copyBtn.textContent=t().copy,1500);}catch(_){}
  };
  const evBtn=$('#evidence-btn');
  if(evBtn)evBtn.onclick=()=>evidence();
  const lv=$('#run-live');
  if(lv)lv.onclick=()=>run(true);
  const apBtn=$('#approve-btn');
  if(apBtn)apBtn.onclick=()=>approveFix(r.order_id);

  document.querySelectorAll('#out .link[data-i]').forEach(el=>{
    const activate=()=>{const l=r.chain[+el.dataset.i];if(l&&l.refs[0])goToRef(l.refs[0]);};
    el.onclick=activate;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}};
  });
  document.querySelectorAll('a.cite').forEach(a=>{
    a.onclick=e=>{e.preventDefault();goToRef(a.dataset.ref);};
  });
  const rl=$('#reset-demo');
  if(rl)rl.onclick=async e=>{e.preventDefault();
    const res=await fetch('/api/reset',{method:'POST'});
    lastFix=null;lastResult=null;$('#out').innerHTML='';
    $('#status').textContent=res.ok?i.resetDone:await res.text();};
  if(scroll)$('#out').scrollIntoView({behavior:'smooth',block:'start'});
}

async function approveFix(orderId, customerConfirmed){
  const i=t();
  const btn=$('#approve-btn');
  const msg=$('#approve-msg');
  if(btn)btn.disabled=true;
  $('#status').textContent=i.approving;
  const beforeChain=lastResult&&lastResult.chain?lastResult.chain.slice():[];
  // moving credits to another address needs the customer's confirmation: ask first instead of waiting for the server's 409
  if(!customerConfirmed&&lastResult&&lastResult.broken==='account_mismatch'){
    if(!confirm(i.confirmAddress)){if(btn)btn.disabled=false;$('#status').textContent='';return;}
    customerConfirmed=true;
  }
  try{
    const payload={order_id:orderId,approved_by:'seller'};
    if(customerConfirmed)payload.customer_confirmed=true;
    const res=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    if(res.status===409||res.status===400){
      const text=await res.text();
      if(res.status===409&&text.startsWith('Ask the customer to confirm')){
        if(confirm(i.confirmAddress)){
          return approveFix(orderId,true);
        }
        if(msg){msg.hidden=false;msg.textContent=text;msg.style.color='var(--bad)';}
        else $('#status').textContent=text;
        return;
      }
      if(msg){msg.hidden=false;msg.textContent=text;msg.style.color='var(--bad)';}
      else $('#status').textContent=text;
      return;
    }
    if(!res.ok){
      $('#status').textContent=i.errHttp;
      return;
    }
    const body=await res.json();
    const audit=body.audit||{};
    const applied=body.applied||{};
    lastFix={
      action_id:audit.action_id||'—',
      detail:applied.detail||audit.detail||'',
      ts:audit.ts||'',
      before:beforeChain,
      after:(body.after&&body.after.chain)||[],
    };
    lastResult=body.after;
    $('#status').textContent=statusLine(body.after);
    showReceipt(body.after);
    render(body.after,{afterFix:true});
  }catch(_){
    $('#status').textContent=i.errNetwork;
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function evidence(){
  const message=$('#msg').value.trim();
  try{
    const res=await fetch('/api/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
    const text=await res.text();
    const w=window.open('','_blank');
    if(w)w.document.write('<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 monospace;padding:20px">'+esc(text)+'</pre>');
  }catch(_){
    $('#status').textContent=t().errNetwork;
  }
}

$('#go').onclick=()=>run(false);
$('#how-link').onclick=()=>{howOpen=!howOpen;renderHow();};
$('#msg').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run(false);}
});
loadLang();
applyChrome();
loadCases();
fetch('/api/config').then(r=>r.json()).then(c=>{cfg=c||{};}).catch(()=>{});
</script></body></html>
