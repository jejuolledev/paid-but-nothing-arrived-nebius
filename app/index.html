function rowsLabel(n){
  const c=Number(n);

  if(lang!=='ko')return label;

const TOOL_EN={find_orders:'Orders by',find_payments:'Payments made by',order_for_payment:'Order behind',related_orders:'Other orders by',order_journey:'Full history of'};
function trTool(name){
  if(!name)return name;

}
function trArgs(a){   // {"email":"EMAIL_2"} -> EMAIL_2 ; {"payment_id":"FROM_PAYMENTS"} -> the payment found above
  if(a==null)return'';if(typeof a==='string')return a;
  const v=Object.values(a).map(x=>({FROM_PAYMENTS:lang==='ko'?'위에서 찾은 결제':'the payment found above',BEST_ORDER:lang==='ko'?'찾은 주문':'the order found'}[x]||x));
  return lang==='ko'?'('+v.join(', ')+')':v.join(', ');
}

function dedupeCitations(text){
  return String(text??'').replace(/(\[[a-z_]+:[^\]]+\])(?:\s*\1)+/gi,'$1');
}

// ---- screenshot proof: upload, drop, paste, examples ----
function setPhoto(dataUrl, exampleId){
  photo=dataUrl||null;photoExample=exampleId||null;
  const img=$('#photo-prev'),x=$('#photo-x');
  if(photo){img.src=photo;img.hidden=false;x.hidden=false;}else{img.hidden=true;img.removeAttribute('src');x.hidden=true;$('#photo').value='';}
}
function readFile(file){
  if(!file||!/^image\//.test(file.type))return;
  if(file.size>8*1024*1024){$('#status').textContent='> 8 MB';return;}
  const fr=new FileReader();fr.onload=()=>setPhoto(fr.result,null);fr.readAsDataURL(file);
}
function renderPhotoSamples(){
  const el=$('#photo-samples');if(!el)return;
  if(!photoExamples.length){el.innerHTML='';return;}
  const i=t();
  el.innerHTML=`<span class="label">${esc(i.photoExamples)}</span>`+photoExamples.map(e=>`<button type="button" class="ghost" data-ex="${esc(e.id)}">${esc(lang==='ko'&&e.label_ko?e.label_ko:e.label)}</button>`).join('');
  el.querySelectorAll('button[data-ex]').forEach(b=>b.onclick=async()=>{
    const e=photoExamples.find(x=>x.id===b.dataset.ex);if(!e)return;
    $('#msg').value=e.message||'';
    try{const blob=await (await fetch('/proof-examples/'+e.id+'.jpg')).blob();const fr=new FileReader();fr.onload=()=>{setPhoto(fr.result,e.id);run(false);};fr.readAsDataURL(blob);}catch(_){}
  });
}
async function loadPhotoExamples(){
  try{const r=await fetch('/api/proof/examples');photoExamples=r.ok?await r.json():[];}catch(_){photoExamples=[];}
  renderPhotoSamples();
}
(()=>{
  const dz=$('#drop');
  $('#photo').onchange=e=>readFile(e.target.files[0]);
  $('#photo-x').onclick=e=>{e.preventDefault();e.stopPropagation();setPhoto(null);};
  ['dragenter','dragover'].forEach(k=>dz.addEventListener(k,e=>{e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(k=>dz.addEventListener(k,e=>{e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
  document.addEventListener('paste',e=>{const it=[...(e.clipboardData||{}).items||[]].find(x=>/^image\//.test(x.type));if(it){e.preventDefault();readFile(it.getAsFile());}});
})();

function statusLine(r){
  const i=t();
  const be=String(r.backend||'');
  const data=be?( /zetaris/i.test(be)?i.dataZetaris:i.dataLocal):'';
  if(!r.ok)return data;
  const parts=[];
  const used=[...new Set((r.model_calls||[]).filter(c=>c.ok!==false&&c.model).map(c=>prettyModel(c.model)))];
  if(r.limited)parts.push(i.limitedExplain(r.limited));
  else if(used.length)parts.push(i.answeredBy(used.join(', ')));
  else if(r.llm==='verifier-only')parts.push(i.recheckExplain);
  else if(r.llm==='failed')parts.push(i.failedExplain);
  else if(r.llm==='unreachable')parts.push(i.unreachableExplain);
  else if(r.llm==='none'||!r.llm)parts.push(i.templateExplain);
  else parts.push(i.answeredBy([...new Set((r.model_calls||[]).filter(c=>c.ok!==false).map(c=>prettyModel(c.model)))].join(', ')||r.llm));
  if(data)parts.push(data);
  if(r.elapsed_ms!=null)parts.push(r.elapsed_ms+' '+i.ms);
  return parts.join(' · ');
}

async function run(live){

    <div class="two" style="margin-top:8px"><div><p class="mut" style="margin:0">${esc(i.verdictWas)}</p><p class="verdict bad" style="font-size:18px">${head(f.before.verdict)}</p></div>
      <div><p class="mut" style="margin:0">${esc(i.verdictNow)}</p><p class="verdict ${f.after.verdict==='ledger_match'?'ok':'bad'}" style="font-size:18px">${head(f.after.verdict,true)}</p></div></div>
    <details><summary style="font-size:15px">${esc(i.replyBefore)}</summary><div class="prose mut">${esc(f.before.reply||'')}</div></details></div>`;
}

function renderFixCard(){
  if(!lastFix)return'';
  const i=t();
  const f=lastFix;
  return `<div class="card fix-card"><h2>${esc(i.fixedByYou)}</h2>
    <p class="prose">${esc(f.detail)}</p>
    <p class="fix-meta">${esc(f.ts)}</p>
    <div class="fix-chains">
      <div class="panel before"><h3>${esc(i.before)}</h3><div class="mini chain">${renderChain(f.before,false)}</div></div>
      <div class="panel after"><h3>${esc(i.after)}</h3><div class="mini chain">${renderChain(f.after,false)}</div></div>
    </div><p class="fix-meta"><a href="/api/audit" target="_blank" rel="noopener">${esc(i.auditLog)}</a> · <a href="#" id="reset-demo">${esc(i.resetDemo)}</a></p></div>`;
}

function render(r, opts){
  const i=t();
  const scroll=!(opts&&opts.scroll===false);
  const afterFix=!!(opts&&opts.afterFix)||!!lastFix;
  hideHowAfterResult();
  if(!r.ok){
    const replyBox=r.customer_reply?`<div class="two"><div class="card"><div class="card-head"><h2>${esc(r.followup?i.replyNow:i.reply)}</h2></div><div class="prose" id="reply-text">${esc(r.customer_reply)}</div></div><div class="card"><div class="card-head"><h2>${esc(i.fix)} <span class="tag ok">${esc(i.noFixNeeded)}</span></h2></div><div class="prose">${esc(r.fix_action||'')}</div></div></div>`:'';
    $('#out').innerHTML=`${renderBanner(r)}${renderTurn2(r)}${renderProof(r)}${renderFixCard()}${r.proof?replyBox:`<div class="card"><div class="headline">${esc(trHeadline(r.headline))}</div><p class="hint">${esc(i.noOrderHint)}</p></div>`}${renderFollowCard(r)}${renderCalls(r)}`;
    const fb0=$('#follow-btn');if(fb0)fb0.onclick=()=>runFollowup();
    const fp0=$('#follow-photo');if(fp0)fp0.onchange=()=>readFollowFile(fp0.files[0]);
    if(scroll)$('#out').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const chain=renderChain(r.chain,true);
  const cited=new Set(r.chain.flatMap(l=>l.refs));
  const rows=Object.entries(r.rows).map(([table,rs])=>rs.length?`<h3 style="margin:10px 0 4px;font-size:14px">${esc(table)} <span class="tag">${esc(rowsLabel(rs.length))}</span></h3><table><tr>${Object.keys(rs[0]).filter(k=>k!=='ref').map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${rs.map(x=>`<tr class="${cited.has(x.ref)?'cited':''}" id="row-${esc(slug(x.ref))}">${Object.entries(x).filter(([k])=>k!=='ref').map(([,v])=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`:'').join('');
  let citeNote=i.citationSkip;
  if(r.citation_check&&r.citation_check.checked)citeNote=r.citation_check.ok?i.citationOk:i.citationFail;
  const noMatch=!!(r.proof&&!r.followup&&['no_matching_payment','unread'].includes(r.proof.verdict));
  const needsFix=r.broken!=null&&!r.proof_blocks_fix;
  const fixTag=needsFix
    ?`<span class="tag warn">${esc(i.needsApproval)}</span>`
    :`<span class="tag ok">${esc(i.noFixNeeded)}</span>`;
  const rc=r.citation_check||{};
  const tplNote=rc.reply_replaced?`<p class="reply-note">${esc(i.replyTemplate(rc.reply_reason||'check failed'))}</p>`:'';
  const replyNote=tplNote+(afterFix?`<p class="reply-note">${esc(i.sendAfterFix)}</p>`:(needsFix?`<p class="reply-note">${esc(i.sendAfterApprove)}</p>`:''));

  $('#out').innerHTML=`
  ${renderBanner(r)}${renderTurn2(r)}${renderProof(r)}${renderFixCard()}
  ${noMatch?`<details class="card"><summary>${esc(i.otherRecords)}</summary>`:'<div class="card">'}${r.proof&&!noMatch?`<h2>${esc(i.recordsTitle)}</h2>`:''}<div class="headline">${esc(trHeadline(r.headline))}</div><div class="mut">order ${esc(r.order_id)} · ${esc(r.email)}</div>${r.ignored_order?`<div class="warnline">${esc(i.ignoredOrder(r.ignored_order))}</div>`:''}${r.sender_unverified?`<div class="warnline">${esc(i.senderUnverified)}</div>`:''}
    <div class="chain">${chain}</div>${noMatch?'</details>':'</div>'}
  <div class="two">
    <div class="card"><div class="card-head"><h2>${esc(r.followup?i.replyNow:i.reply)}</h2><button type="button" class="ghost" id="copy-reply">${esc(i.copy)}</button></div>
      ${replyNote}<div class="prose" id="reply-text">${esc(r.customer_reply)}</div>
      <div style="margin-top:10px"><button type="button" class="ghost" id="evidence-btn">${esc(i.evidenceBtn)}</button></div></div>
    <div class="card"><div class="card-head"><h2>${esc(i.fix)} ${fixTag}</h2></div><div class="prose">${esc(r.fix_action)}</div>
      ${needsFix?`<div style="margin-top:10px"><button type="button" id="approve-btn">${esc(i.approveFix)}</button></div>`:''}
      <p id="approve-msg" class="hint" style="margin:8px 0 0" hidden></p></div>
  </div>
  ${renderFollowCard(r)}
  ${noMatch||r.followup?'':renderClaims(r)}
  ${noMatch?'':renderIntake(r)}
  ${noMatch?'':renderSteps(r.steps)}
  ${renderCalls(r)}
  ${noMatch?'<div hidden>':''}<div class="card"><h2>${esc(i.why)}</h2>${renderWhy(r)}${(!r.citation_check||!r.citation_check.checked||r.citation_check.replaced_with_verifier_text)?`<p class="hint">${esc(i.knownPattern)}</p>`:''}
    <p class="mut" style="font-size:12px">${esc(citeNote)}</p></div>
  <div class="card two"><div><h2>${esc(i.verified)}</h2><ul>${r.verified.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>
    <div><h2>${esc(i.unverified)}</h2><ul>${r.unverified.map(v=>`<li>${esc(v)}</li>`).join('')||`<li class="mut">—</li>`}</ul></div></div>${noMatch?'</div>':''}
  <details class="card rows" id="evidence"><summary>${esc(i.evidence)}</summary>${(()=>{const q=(r.queries||[]).filter(x=>x.tool==='order_journey').pop();return q?`<p class="hint">${esc(i.oneQuery(sqlSource(r),q.rows))}</p><pre class="sqlbox">${esc(prettySql(q.sql))}</pre>`:'';})()}${rows}</details>
  <details class="card" id="trace"><summary>${esc(i.trace)}</summary><ul>${(r.trace||[]).map(tr=>`<li><b>${esc(tr.step)}</b> — ${esc(tr.detail)} <span class="mut">${esc(tr.ms)} ${esc(i.ms)}</span></li>`).join('')}</ul>${(r.queries||[]).length?`<p class="hint">${esc(i.allSql(sqlSource(r)))}</p><pre class="sqlbox">${esc(r.queries.map(q=>`-- ${q.tool} · ${q.rows} row(s)\n`+prettySql(q.sql)).join('\n\n'))}</pre>`:''}</details>`;

  const copyBtn=$('#copy-reply');
  if(copyBtn)copyBtn.onclick=async()=>{
    try{await navigator.clipboard.writeText(r.customer_reply);copyBtn.textContent=t().copied;setTimeout(()=>copyBtn.textContent=t().copy,1500);}catch(_){}
  };
  const fb=$('#follow-btn');if(fb)fb.onclick=()=>runFollowup();
  const fp=$('#follow-photo');if(fp)fp.onchange=()=>readFollowFile(fp.files[0]);
  const evBtn=$('#evidence-btn');
  if(evBtn)evBtn.onclick=()=>evidence();
  const lv=$('#run-live');
  if(lv)lv.onclick=()=>run(true);
  const apBtn=$('#approve-btn');
  if(apBtn)apBtn.onclick=()=>approveFix(r.order_id);

  document.querySelectorAll('#out .link[data-i]').forEach(el=>{
    const activate=()=>{const l=r.chain[+el.dataset.i];if(l&&l.refs[0])goToRef(l.refs[0]);};
    el.onclick=activate;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}};
  });
  document.querySelectorAll('a.cite').forEach(a=>{
    a.onclick=e=>{e.preventDefault();goToRef(a.dataset.ref);};
  });
  const rl=$('#reset-demo');
  if(rl)rl.onclick=async e=>{e.preventDefault();
    const res=await fetch('/api/reset',{method:'POST'});
    lastFix=null;lastResult=null;$('#out').innerHTML='';
    $('#status').textContent=res.ok?i.resetDone:await res.text();};
  if(scroll)$('#out').scrollIntoView({behavior:'smooth',block:'start'});
}

async function approveFix(orderId, customerConfirmed){
  const i=t();
  const btn=$('#approve-btn');
  const msg=$('#approve-msg');
  if(btn)btn.disabled=true;
  $('#status').textContent=i.approving;
  const beforeChain=lastResult&&lastResult.chain?lastResult.chain.slice():[];
  // moving credits to another address needs the customer's confirmation: ask first instead of waiting for the server's 409
  if(!customerConfirmed&&lastResult&&lastResult.broken==='account_mismatch'){
    if(!confirm(i.confirmAddress)){if(btn)btn.disabled=false;$('#status').textContent='';return;}
    customerConfirmed=true;
  }
  try{
    const payload={order_id:orderId,approved_by:'seller'};
    if(customerConfirmed)payload.customer_confirmed=true;
    const res=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    if(res.status===409||res.status===400){
      const text=await res.text();
      if(res.status===409&&text.startsWith('Ask the customer to confirm')){
        if(confirm(i.confirmAddress)){
          return approveFix(orderId,true);
        }
        if(msg){msg.hidden=false;msg.textContent=text;msg.style.color='var(--bad)';}
        else $('#status').textContent=text;
        return;
      }
      if(msg){msg.hidden=false;msg.textContent=text;msg.style.color='var(--bad)';}
      else $('#status').textContent=text;
      return;
    }
    if(!res.ok){
      $('#status').textContent=i.errHttp;
      return;
    }
    const body=await res.json();
    const audit=body.audit||{};
    const applied=body.applied||{};
    lastFix={
      action_id:audit.action_id||'—',
      detail:applied.detail||audit.detail||'',
      ts:audit.ts||'',
      before:beforeChain,
      after:(body.after&&body.after.chain)||[],
    };
    lastResult=body.after;
    $('#status').textContent=statusLine(body.after);
    showReceipt(body.after);
    render(body.after,{afterFix:true});
  }catch(_){
    $('#status').textContent=i.errNetwork;
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function evidence(){
  const message=$('#msg').value.trim();
  try{
    const res=await fetch('/api/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
    const text=await res.text();
    const w=window.open('','_blank');
    if(w)w.document.write('<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 monospace;padding:20px">'+esc(text)+'</pre>');
  }catch(_){
    $('#status').textContent=t().errNetwork;
  }
}

$('#go').onclick=()=>run(false);
$('#tour-btn').onclick=()=>tour();
$('#how-link').onclick=()=>{howOpen=!howOpen;renderHow();};
$('#msg').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run(false);}
});
loadLang();
applyChrome();
loadCases();
loadPhotoExamples();
fetch('/api/config').then(r=>r.json()).then(c=>{cfg=c||{};}).catch(()=>{});
</script></body></html>
