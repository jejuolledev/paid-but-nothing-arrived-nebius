<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>$base
body { --bg:#fbf7f2; --fg:#2a2420; --muted:#8a7f76; --card:#fff; --acc:#c46a3c; --ok:#3c8f6a; --warn:#c48a1c; --line:#efe6dc; }
body.dark { --bg:#141110; --fg:#f1ebe5; --muted:#a49a91; --card:#201c19; --acc:#e59466; --ok:#6cc39a; --warn:#e2b04f; --line:#2f2a26; }
.nav { height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:16px; font-weight:700; }
.brand { color:var(--acc); font-weight:800; }
.st { text-align:center; margin-top:14px; }
.st .ic { width:58px; height:58px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; background:var(--stc); }
.st .t { font-size:20px; font-weight:800; }
.st .s { font-size:13px; color:var(--muted); margin-top:4px; }
.amt { text-align:center; font-size:34px; font-weight:800; margin:14px 0 4px; }
.card { background:var(--card); margin:12px 16px; border-radius:18px; padding:6px 18px; }
.row { display:flex; justify-content:space-between; padding:10px 0; font-size:14px; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:none; }
.row span:first-child { color:var(--muted); }
.row span:last-child { font-weight:600; text-align:right; }
.bn { margin:10px 16px; border-radius:14px; padding:12px 16px; background:#2f6f62; color:#fff; font-size:13px; }
.bn b { display:block; font-size:15px; }
.btn { margin:14px 16px; border-radius:14px; padding:15px; text-align:center; font-weight:800; font-size:16px; background:var(--acc); color:#fff; }
.sel { margin:0 16px; }
.opt { background:var(--card); border-radius:14px; padding:13px 16px; margin-bottom:8px; font-size:14px; display:flex; justify-content:space-between; border:1.5px solid var(--line); }
</style></head><body class="$bodyclass">
<div class="sb"><span>$sb_time</span><span class="r"><span class="bars">▂▄▆█</span> 5G <span class="batt"><i style="width:$batt_w"></i></span></span></div>
<div class="nav"><span>✕</span><span class="brand">도토리페이</span><span>⋯</span></div>
$body
<div class="home"></div>
</body></html>
