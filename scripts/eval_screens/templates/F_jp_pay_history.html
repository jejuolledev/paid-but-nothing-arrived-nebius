<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>$base
body { --bg:#ffffff; --fg:#17201a; --muted:#78837b; --acc:#7cbf2f; --line:#edf0ec; --soft:#f3f8ec; --neg:#17201a; --pend:#c4791c; }
body.dark { --bg:#0e110e; --fg:#e9efe6; --muted:#97a294; --acc:#9ad44f; --line:#232823; --soft:#182016; --neg:#e9efe6; --pend:#e8a548; }
.hd { padding:6px 18px 10px; }
.hd h1 { font-size:20px; font-weight:800; }
.bal { margin:6px 16px 10px; background:var(--soft); border-radius:16px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
.bal .k { font-size:12px; color:var(--muted); }
.bal .v { font-size:22px; font-weight:800; }
.bal .btn { background:var(--acc); color:#fff; font-weight:700; font-size:13px; border-radius:16px; padding:7px 14px; }
.tabs { display:flex; gap:18px; padding:0 18px; font-size:14px; border-bottom:1px solid var(--line); }
.tabs span { padding:8px 0; color:var(--muted); }
.tabs .on { color:var(--fg); font-weight:700; border-bottom:2.5px solid var(--acc); }
.dh { padding:12px 18px 4px; font-size:12.5px; color:var(--muted); font-weight:700; background:var(--bg); }
.it { display:flex; padding:10px 18px; border-bottom:1px solid var(--line); align-items:center; }
.it .ic { width:36px; height:36px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:15px; margin-right:12px; }
.it .m { flex:1; }
.it .m .t { font-size:14.5px; font-weight:600; }
.it .m .s { font-size:12px; color:var(--muted); margin-top:2px; }
.it .a { text-align:right; font-weight:700; font-size:15px; }
.it .a .s2 { font-size:11.5px; color:var(--muted); font-weight:500; margin-top:2px; }
.pend { color:var(--pend); }
.promo { margin:12px 16px; border-radius:12px; padding:10px 14px; background:#fff3d6; color:#5a4410; font-size:12.5px; }
body.dark .promo { background:#33290f; color:#f2dca0; }
</style></head><body class="ja $bodyclass">
<div class="sb"><span>$sb_time</span><span class="r"><span class="bars">▂▄▆█</span> 4G <span class="batt"><i style="width:$batt_w"></i></span></span></div>
<div class="hd"><h1>ひかりペイ　取引履歴</h1></div>
<div class="bal"><div><div class="k">残高</div><div class="v num">$balance円</div></div><span class="btn">チャージ</span></div>
<div class="tabs"><span class="on">すべて</span><span>支払い</span><span>チャージ</span><span>ポイント</span></div>
$list
<div class="promo">今月のポイント還元 $promo_pt pt 獲得予定 ／ 対象店舗で最大5%還元</div>
<div class="home"></div>
</body></html>
