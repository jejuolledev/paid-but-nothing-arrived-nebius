<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>$base
body { --bg:#f6f4fa; --fg:#1c1a24; --muted:#7a7488; --card:#fff; --line:#ebe7f2; --acc:#6a3fa0; --acc2:#f1e9fb; }
body.dark { --bg:#121016; --fg:#ece8f4; --muted:#9a93a8; --card:#1d1a23; --line:#2b2733; --acc:#b593e0; --acc2:#2a2236; }
.nav { height:48px; display:flex; align-items:center; padding:0 18px; font-size:17px; }
.nav b { flex:1; text-align:center; margin-right:22px; font-weight:700; }
.acct { margin:6px 20px 0; font-size:13px; color:var(--muted); }
.hero { background:var(--card); margin:10px 16px; border-radius:18px; padding:22px 20px 18px; text-align:center; }
.hero .lab { display:inline-block; background:var(--acc2); color:var(--acc); font-size:12px; font-weight:700; padding:3px 10px; border-radius:10px; }
.hero .amt { font-size:32px; font-weight:800; margin:10px 0 6px; }
.hero .mer { font-size:16px; font-weight:600; }
table { width:calc(100% - 32px); margin:0 16px; background:var(--card); border-radius:18px; padding:8px 18px; border-collapse:separate; }
th, td { font-size:14px; padding:10px 0; border-bottom:1px solid var(--line); }
tr:last-child th, tr:last-child td { border-bottom:none; }
th { text-align:left; color:var(--muted); font-weight:500; width:100px; }
td { text-align:right; font-weight:600; }
.banner { margin:12px 16px; border-radius:14px; padding:12px 16px; background:linear-gradient(90deg,#7b52b4,#a77ad6); color:#fff; font-size:13px; }
.banner b { font-size:15px; display:block; }
.sect { margin:14px 20px 4px; font-size:13px; font-weight:700; color:var(--muted); }
.li { display:flex; justify-content:space-between; margin:0 20px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
.li span:last-child { font-weight:600; }
</style></head><body class="$bodyclass">
<div class="sb"><span>$sb_time</span><span class="r"><span class="bars">▂▄▆█</span> 5G <span class="batt"><i style="width:$batt_w"></i></span></span></div>
<div class="nav">‹ <b>거래내역 상세</b></div>
<div class="acct">누리 자유입출금 · 1002-***-482913</div>
<div class="hero"><span class="lab">$label</span>
 <div class="amt num"><span class="ef" id="t-amount">-$amount_fmt원</span></div>
 <div class="mer">모아허브(MOAHUB)</div></div>
<table>
 <tr><th>거래일시</th><td class="num"><span class="ef" id="t-dt">$date_dot $time_hms</span></td></tr>
 <tr><th>거래구분</th><td>체크카드 결제</td></tr>
 <tr><th>카드번호</th><td class="num">****$last4</td></tr>
 <tr><th>처리상태</th><td>$status_text</td></tr>
 <tr><th>거래 후 잔액</th><td class="num">$balance원</td></tr>
 <tr><th>누리포인트</th><td class="num">+$points P 적립</td></tr>
</table>
<div class="banner"><b>누리 자유적금 연 3.8%</b>매달 $ad_amount원씩 · 최대 1,000,000원까지</div>
<div class="sect">같은 날 다른 거래</div>
$others
<div class="home"></div>
</body></html>
